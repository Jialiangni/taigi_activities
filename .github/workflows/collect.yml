name: Collect event review candidates
on:
  schedule:
    - cron: '15 19 * * *' # Taiwan 03:15; completion triggers review and publication.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-candidate-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local Traditional Chinese poster OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-eng
          tesseract --list-langs

      - name: Test candidate collectors
        run: python3 -m unittest discover -s tests -v
      - name: Collect review candidates
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python3 -u -m crawler.collect
      - name: Preserve source diagnostics even when collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-review-candidates
          path: |
            data/candidates/*.json
            !data/candidates/instagram.json
            !data/candidates/threads.json
            !data/candidates/threads_review.json
          if-no-files-found: warn
          retention-days: 14
      # Preserve public-source candidates; retired Threads files are excluded.
      # Raw authorized social responses stay on the runner.
      # Completion triggers deploy.yml, which reviews public candidates before publishing.
      # No Pages upload of unreviewed event or social data.
