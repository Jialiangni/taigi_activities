name: Collect event review candidates
on:
  schedule:
    - cron: '15 19 * * *' # Taiwan 03:15; publication remains a separate verified-data job.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-candidate-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test candidate collectors
        run: python3 -m unittest discover -s tests -v
      - name: Collect review candidates
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_IDS: ${{ secrets.FACEBOOK_PAGE_IDS }}
          FACEBOOK_PAGE_ID_MAP: ${{ secrets.FACEBOOK_PAGE_ID_MAP }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python3 -u -m crawler.collect
      - name: Preserve source diagnostics even when collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-review-candidates
          path: |
            data/candidates/*.json
            !data/candidates/facebook.json
            !data/candidates/instagram.json
            !data/candidates/threads.json
          if-no-files-found: warn
          retention-days: 14
      # Preserve public-source candidates for review; authorized social content stays on the runner.
      # No automatic commit and no Pages upload of unreviewed event or social data.
