name: Deploy Taigi Calendar to GitHub Pages

on:
  workflow_run:
    workflows: [Collect event review candidates]
    types: [completed]
    branches: [main]
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊立即執行
  push:
    branches:
      - main

# 設定 GitHub Pages 部屬權限
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')) ||
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install local Traditional Chinese poster OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-eng
          tesseract --list-langs

      - name: Test publication gates and calendar exports
        run: python3 -m unittest discover -s tests -v

      - name: Download recent public candidates from trusted collection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTION_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: python3 scripts/fetch_review_candidates.py --output "$RUNNER_TEMP/review-candidates"

      - name: Verify candidates and exclude published sessions
        run: python3 -u -m crawler.review --candidates "$RUNNER_TEMP/review-candidates" --apply

      - name: Preserve review decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-review-decisions
          path: data/audit/latest-candidate-review.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify official sources and build calendar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAIGI_AI_MODEL: ${{ vars.TAIGI_AI_MODEL || 'gpt-5.4' }}
        run: |
          python3 -u main.py --check-sources --write-ai

      - name: Preserve AI editorial results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-editorial-results
          path: |
            data/ai_taigi.json
            data/audit/latest-ai-editorial.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify browser logic and calendar download content
        run: node tests/test_frontend.cjs

      - name: Commit updated files if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/verified_activities.json data/ui_taigi.json data/ui_price_taigi.json data/audit/latest-candidate-review.json data/ai_taigi.json data/audit/latest-ai-editorial.json index.html taigi_activities.ics
          if ! git diff --staged --quiet; then
            git commit -m "Review candidates and update verified calendar [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage public files only
        run: |
          mkdir -p public
          cp index.html taigi_activities.ics manifest.json public/
          cp -R assets calendar-events public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 核查紀錄及未核實舊資料留在 Git，不作為網站檔案發布。
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
