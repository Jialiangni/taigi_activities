name: Deploy Taigi Calendar to GitHub Pages

on:
  schedule:
    - cron: '0 17 * * *' # Asia/Taipei daily 01:00: expiration only, no AI.
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊立即執行
  push:
    branches:
      - main
    paths-ignore:
      - "data/editorial/queue.json"
      - "data/audit/**"
      - "**.md"

# 設定 GitHub Pages 部屬權限
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: taigi-repository-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install local Traditional Chinese poster OCR
        if: github.event_name != 'schedule'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-eng
          tesseract --list-langs

      - name: Test publication gates and calendar exports
        run: python3 -m unittest discover -s tests -v

      - name: Import completed editorial and recheck incoming sources
        if: github.event_name != 'schedule'
        run: python3 -u -m crawler.editorial_queue ingest

      - name: Build verified calendar and remove expired sessions
        # Scheduled maintenance only rebuilds the already-verified catalog.
        # Incoming events were source-checked by ingest; no AI runs in CI.
        run: python3 -u main.py

      - name: Verify browser logic and calendar download content
        run: node tests/test_frontend.cjs

      - name: Commit updated files if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/verified_activities.json data/ai_taigi.json data/editorial/queue.json data/editorial/receipts.json index.html taigi_activities.ics
          if ! git diff --staged --quiet; then
            git commit -m "Apply reviewed copy and expire ended sessions [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage public files only
        run: |
          mkdir -p public
          cp index.html taigi_activities.ics manifest.json public/
          cp -R assets calendar-events public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 核查紀錄及未核實舊資料留在 Git，不作為網站檔案發布。
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
