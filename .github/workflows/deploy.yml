name: Deploy Taigi Calendar to GitHub Pages

on:
  schedule:
    # 每天台灣時間凌晨 04:00 自動更新活動資料 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊立即執行
  push:
    branches:
      - main

# 設定 GitHub Pages 部屬權限
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test publication gates and calendar exports
        run: python3 -m unittest discover -s tests -v

      - name: Verify official sources and build calendar
        run: |
          python3 main.py --check-sources

      - name: Verify browser logic and calendar download content
        run: node tests/test_frontend.cjs

      - name: Commit updated files if changed
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html taigi_activities.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新台語活動資料庫 [skip ci]" && git push)
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage public files only
        run: |
          mkdir -p public
          cp index.html taigi_activities.ics manifest.json public/
          cp -R assets public/assets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 核查紀錄及未核實舊資料留在 Git，不作為網站檔案發布。
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
